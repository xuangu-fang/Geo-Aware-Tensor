[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "geo-aware-tensor"
version = "0.1.0"
description = "Operator-spectral Bayesian and neural functional tensor POC"
requires-python = ">=3.10"
dependencies = [
  "numpy>=2.0",
  "scipy>=1.13",
  "torch>=2.4,<2.9",
  "matplotlib>=3.8",
  "h5py>=3.11",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
data = ["fsspec>=2025.3", "aiohttp>=3.10,<4"]
docs = ["Markdown>=3.7,<4", "weasyprint>=62,<69"]
operator-baselines = ["neuraloperator==2.0.0"]

[project.scripts]
geo-tensor-poc = "geoaware.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
